location ^~ /api/model/v1/ {
    proxy_pass http://127.0.0.1:18941/v1/;
    proxy_http_version 1.1;
    set $model_relay_connection "";
    if ($http_upgrade ~* websocket) { set $model_relay_connection "upgrade"; }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $model_relay_connection;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 540s;
    client_max_body_size 512k;
}

location ^~ /api/model/v1beta/ {
    proxy_pass http://127.0.0.1:18941/v1beta/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 540s;
    client_max_body_size 512k;
}

location ^~ /api/v2/model-relay/internal/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    try_files $uri /index.php$is_args$query_string;
}

mode: rule
mixed-port: 8964
allow-lan: true
log-level: info
ipv6: true
external-controller: 127.0.0.1:18964
secret: set-your-secret
unified-delay: true
dns:
  enable: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - v2b.151376.xyz
  - v2.151376.xyz
  - '*.151376.xyz'
  - '*.buncloud.eu.org'
  - ntp.*.com
  - time.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  default-nameserver:
  - 223.6.6.6
  - 8.8.8.8
  nameserver:
  - 8.8.8.8
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  - https://dns.quad9.net/dns-query
  nameserver-policy:
    +.cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.中国:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.google.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.googleapis.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.gstatic.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.youtube.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.github.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.githubusercontent.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.githubassets.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.openai.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.chatgpt.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.docker.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.docker.io:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.pypi.org:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.pythonhosted.org:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.anaconda.com:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    +.anaconda.org:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
profile:
  store-selected: true
bind-address: '*'
external-controller-pipe: \\.\pipe\verge-mihomo

hosts:
  mtalk.google.com: 142.250.157.188
  alt1-mtalk.google.com: 74.125.200.188
  alt2-mtalk.google.com: 142.250.141.188
